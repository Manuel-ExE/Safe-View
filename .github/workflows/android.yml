name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'
          build-root-directory: android-skeleton
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safeview-debug-apk
          path: android-skeleton/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping and reports if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeview-build-reports
          path: |
            android-skeleton/app/build/reports/
            android-skeleton/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

permissions:
  contents: read
