name: Android validation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: android-skeleton
      - run: ./gradlew --no-daemon lintDebug assembleDebug
        working-directory: android-skeleton
      - name: Upload SafeView debug APK
        uses: actions/upload-artifact@v4
        with:
          name: safeview-debug-apk
          path: android-skeleton/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
